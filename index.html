<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" id="themeColorMeta" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="JAM POS">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/x-icon" href="icon-192.ico">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <meta name="msapplication-TileColor" content="#3b82f6">
    <meta name="msapplication-TileImage" content="icon-192.png">
    <meta name="format-detection" content="telephone=no">
    <meta name="color-scheme" id="colorSchemeMeta" content="light">
    <link rel="manifest" href="manifest.json" id="manifestLink">
    <title>JAM POS v1.1 By @felinuxs</title>
    <script src="tailwind.js"></script>
    <link rel="stylesheet" href="fontawesome.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- Piel "Odoo" para escritorio (solo width >= 1024px) -->
    <link rel="stylesheet" href="style-odoo.css">
    <!-- Splash de arranque: capa decorativa que dura exactamente lo que dura el
         MP3 de inicio firme (juega el sonido + el logo se "llena de agua").
         Se carga SIN bloqueo sobre <body> (aun no parseado) para que atriche
         de inmediato; app.js arranca debajo al mismo tiempo sin retraso. -->
    <script src="splash.js"></script>
    <script src="html2canvas.min.js"></script>
    <script src="quagga.min.js"></script>
    <script src="vendor/peerjs.min.js"></script>
    <script src="vendor/qrcode-gen.js"></script>
    <script src="vendor/jsqr.js"></script>
    <script src="sync-core.js"></script>
    <script src="sync.js"></script>
    <script src="web-bridge.js"></script>
    <script src="trial.js"></script>
    <script src="update-notify.js"></script>
    <script src="promo-notify.js"></script>
</head>
<body>
    <!-- Barra de ventana propia (solo escritorio frameless): sin menu nativo,
         tintada del color de fondo del tema (blanco/negro). Oculto en web/APK. -->
    <div id="desktopTitlebar">
        <span id="desktopTitlebarTitulo">JAM POS v1.1</span>
        <div id="desktopTitlebarBtns">
            <button class="dbtn" id="dbtnMin" title="Minimizar" aria-label="Minimizar">
                <svg viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg"><rect y="4.5" width="10" height="1" fill="currentColor"/></svg>
            </button>
            <button class="dbtn" id="dbtnMax" title="Maximizar" aria-label="Maximizar">
                <svg viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="9" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1"/></svg>
            </button>
            <button class="dbtn dbtn-close" id="dbtnClose" title="Cerrar" aria-label="Cerrar">
                <svg viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg"><path d="M1 1 L9 9 M9 1 L1 9" stroke="currentColor" stroke-width="1.2"/></svg>
            </button>
        </div>
    </div>
    <div class="sidebar" id="sidebarNav"></div>
    <div class="main-container" id="appRoot"></div>
    <script src="app.js"></script>
    <script src="odoo-ui.js"></script>
</body>
</html>
